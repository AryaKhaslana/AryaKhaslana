<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap');
      
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .title { font-size: 32px; font-weight: 600; fill: #F4F4F5; letter-spacing: -0.5px; }
      .subtitle { font-size: 15px; font-weight: 400; fill: #A1A1AA; letter-spacing: 0.2px; }
      .tag { font-size: 11px; font-weight: 500; fill: #D4D4D8; letter-spacing: 0.5px; }
      .status-text { font-size: 10px; font-weight: 600; fill: #10B981; letter-spacing: 1px; }
      
      /* Animasi Elegan (Sangat Halus) */
      @keyframes float1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes float2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
      @keyframes pulse { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.5); } }
      @keyframes dash { to { stroke-dashoffset: -100; } }

      .float-slow { animation: float1 6s ease-in-out infinite; }
      .float-slower { animation: float2 8s ease-in-out infinite; }
      .path-flow { stroke-dasharray: 4 6; animation: dash 8s linear infinite; }
    </style>
    
    <!-- Ambient Top Glow -->
    <radialGradient id="top-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272A" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#52525B" stop-opacity="1" />
      <stop offset="100%" stop-color="#27272A" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="#09090B" />
  <rect width="100%" height="100%" fill="url(#top-glow)" />
  
  <!-- Faint Minimalist Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.03"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- ==================== LEFT: TYPOGRAPHY & IDENTITY ==================== -->
  <g transform="translate(60, 90)">
    <text y="0" class="font-sans title">Arya Chaka Braja Wisesa</text>
    <text y="28" class="font-sans subtitle">Backend Software Engineer</text>
    
    <!-- Subtle Availability Indicator -->
    <g transform="translate(0, 55)">
      <circle cx="5" cy="5" r="3.5" fill="#10B981" />
      <circle cx="5" cy="5" r="3.5" fill="#10B981" style="animation: pulse 2.5s infinite; transform-origin: 5px 5px;" />
      <text x="16" y="9" class="font-sans status-text">BUILDING SCALABLE SYSTEMS</text>
    </g>
  </g>

  <!-- ==================== BOTTOM LEFT: TECH STACK PILLS ==================== -->
  <!-- Desain Pill Modern ala Apple/Vercel -->
  <g transform="translate(60, 195)">
    <!-- Node.js -->
    <g transform="translate(0,0)">
      <rect width="65" height="24" rx="12" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="32.5" y="16" text-anchor="middle" class="font-sans tag">Node.js</text>
    </g>
    <!-- Express.js -->
    <g transform="translate(75,0)">
      <rect width="75" height="24" rx="12" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="37.5" y="16" text-anchor="middle" class="font-sans tag">Express</text>
    </g>
    <!-- PostgreSQL -->
    <g transform="translate(160,0)">
      <rect width="85" height="24" rx="12" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="42.5" y="16" text-anchor="middle" class="font-sans tag">PostgreSQL</text>
    </g>
    <!-- Prisma -->
    <g transform="translate(255,0)">
      <rect width="60" height="24" rx="12" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="30" y="16" text-anchor="middle" class="font-sans tag">Prisma</text>
    </g>
    <!-- Next.js -->
    <g transform="translate(325,0)">
      <rect width="65" height="24" rx="12" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="32.5" y="16" text-anchor="middle" class="font-sans tag">Next.js</text>
    </g>
  </g>

  <!-- ==================== RIGHT: ABSTRACT DATA ARCHITECTURE ==================== -->
  <g transform="translate(480, 50)">
    <!-- Smooth Bezier Connecting Lines -->
    <path d="M 60 75 C 110 75, 140 30, 190 30" fill="none" stroke="url(#line-grad)" stroke-width="1.5" class="path-flow" />
    <path d="M 60 75 C 110 75, 140 120, 190 120" fill="none" stroke="url(#line-grad)" stroke-width="1.5" class="path-flow" style="animation-direction: reverse;" />
    <path d="M 190 30 C 230 30, 240 75, 275 75" fill="none" stroke="url(#line-grad)" stroke-width="1.5" />
    <path d="M 190 120 C 230 120, 240 75, 275 75" fill="none" stroke="url(#line-grad)" stroke-width="1.5" />

  </g>
</svg>
