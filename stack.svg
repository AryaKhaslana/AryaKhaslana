<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="Tech stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: "JetBrains Mono", "SF Mono", "Courier New", ui-monospace, monospace; }
    .dim  { fill: #6e7681; }
    .key  { fill: #3fb950; }
    .val  { fill: #c9d1d9; }

    .ln { opacity: 0; animation: reveal 12s ease-out infinite; }
    @keyframes reveal {
      0%   { opacity: 0; transform: translateX(-6px); }
      4%   { opacity: 1; transform: translateX(0); }
      92%  { opacity: 1; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(0); }
    }
    .d1 { animation-delay: .2s }  .d2 { animation-delay: .9s }
    .d3 { animation-delay: 1.5s } .d4 { animation-delay: 2.1s }
    .d5 { animation-delay: 2.7s } .d6 { animation-delay: 3.4s }

    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

    .scan { animation: scan 7s linear infinite; }
    @keyframes scan { 0% { transform: translateY(-40px) } 100% { transform: translateY(300px) } }
  </style>

  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#21262d"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="box"><rect x="1" y="1" width="838" height="298" rx="10"/></clipPath>
  </defs>

  <rect x="1" y="1" width="838" height="298" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <g clip-path="url(#box)">
    <rect x="0" y="0" width="840" height="300" fill="url(#grid)"/>
    <rect class="scan" x="0" y="0" width="840" height="40" fill="url(#beam)"/>

    <circle cx="26" cy="26" r="4.5" fill="#30363d"/>
    <circle cx="44" cy="26" r="4.5" fill="#30363d"/>
    <circle cx="62" cy="26" r="4.5" fill="#30363d"/>

    <g class="mono" font-size="17">
      <g class="ln d1">
        <text x="40" y="82" class="key" font-weight="600">❯</text>
        <text x="64" y="82" class="val">cat stack.json</text>
      </g>

      <g class="ln d2">
        <text x="40" y="126" class="dim">runtime</text>
        <text x="180" y="126" class="val">Node.js · Express</text>
      </g>
      <g class="ln d3">
        <text x="40" y="158" class="dim">database</text>
        <text x="180" y="158" class="val">PostgreSQL · Prisma · Redis</text>
      </g>
      <g class="ln d4">
        <text x="40" y="190" class="dim">frontend</text>
        <text x="180" y="190" class="val">Next.js · React · TypeScript · Tailwind</text>
      </g>
      <g class="ln d5">
        <text x="40" y="222" class="dim">motion</text>
        <text x="180" y="222" class="val">GSAP · Framer Motion</text>
      </g>
      <g class="ln d6">
        <text x="40" y="254" class="dim">infra</text>
        <text x="180" y="254" class="val">Docker · Git · Nginx</text>
        <rect class="cur" x="392" y="238" width="9" height="19" fill="#3fb950"/>
      </g>
    </g>

    <line x1="40" y1="100" x2="800" y2="100" stroke="#21262d" stroke-width="1"/>
  </g>
</svg>
