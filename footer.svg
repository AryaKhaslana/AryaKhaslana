<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
      
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .title { font-size: 14px; font-weight: 600; fill: #F4F4F5; }
      .subtitle { font-size: 12px; font-weight: 500; fill: #A1A1AA; }
      .detail { font-size: 10px; font-weight: 600; fill: #71717A; letter-spacing: 0.5px; text-transform: uppercase; }
      .accent { fill: #3B82F6; font-weight: bold; }
      
      /* Audio Visualizer Absolute Animation */
      @keyframes eq1 { 0%, 100% { height: 6px; y: 77; } 50% { height: 16px; y: 67; } }
      @keyframes eq2 { 0%, 100% { height: 12px; y: 71; } 50% { height: 22px; y: 61; } }
      @keyframes eq3 { 0%, 100% { height: 8px; y: 75; } 50% { height: 18px; y: 65; } }
      
      .bar { fill: #3B82F6; rx: 1.5; }
      .b1 { animation: eq1 1.2s ease-in-out infinite; }
      .b2 { animation: eq2 0.8s ease-in-out infinite 0.2s; }
      .b3 { animation: eq3 1.5s ease-in-out infinite 0.4s; }
      .b4 { animation: eq2 1.1s ease-in-out infinite 0.1s; }
      .b5 { animation: eq1 0.9s ease-in-out infinite 0.5s; }
    </style>
  </defs>

  <!-- Background Transparan biar nyatu sama warna GitHub lu -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Single Unified Card (Anti-Break Layout) -->
  <rect x="25" y="20" width="800" height="100" rx="12" fill="#09090B" stroke="#27272A" stroke-width="1.5" />

  <!-- Center Divider Elegan -->
  <line x1="425" y1="40" x2="425" y2="100" stroke="#27272A" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- ==================== LEFT: MUSIC INFO ==================== -->
  <text x="60" y="45" class="font-sans detail">NOW PLAYING</text>
  <text x="60" y="70" class="font-sans title">Exile (feat. Bon Iver) - Taylor Swift</text>
  <text x="60" y="90" class="font-sans subtitle">High-Res FLAC via KZ EDX Pro X (EasyEffects)</text>

  <!-- EQ Bars -->
  <rect x="375" y="77" width="3" height="6" class="bar b1" />
  <rect x="382" y="71" width="3" height="12" class="bar b2" />
  <rect x="389" y="75" width="3" height="8" class="bar b3" />
  <rect x="396" y="71" width="3" height="12" class="bar b4" />
  <rect x="403" y="77" width="3" height="6" class="bar b5" />

  <!-- ==================== RIGHT: SOCIALS & COMMS ==================== -->
  <text x="460" y="45" class="font-sans detail">SECURE COMMS</text>

  <!-- Row 1 -->
  <text x="460" y="70" class="font-sans title accent">></text>
  <text x="475" y="70" class="font-sans title">github.com/AryaKhaslana</text>

  <text x="655" y="70" class="font-sans title accent">></text>
  <text x="670" y="70" class="font-sans subtitle">in/aryachaka</text>

  <!-- Row 2 -->
  <text x="460" y="92" class="font-sans title accent">></text>
  <text x="475" y="92" class="font-sans subtitle">dsc: aryakhaslana</text>

  <text x="655" y="92" class="font-sans title accent">></text>
  <text x="670" y="92" class="font-sans subtitle">ig: @brajachaka</text>
</svg>
