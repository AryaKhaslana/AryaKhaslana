<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .text-name { font-size: 24px; font-weight: 600; fill: #F4F4F5; letter-spacing: -0.5px; }
      .text-role { font-size: 14px; font-weight: 400; fill: #A1A1AA; }
      .text-node { font-size: 12px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
      .text-stack { font-size: 10px; font-weight: 500; fill: #71717A; text-anchor: middle; letter-spacing: 0.5px; text-transform: uppercase; }
      
      /* Animasi Halus & Aman */
      @keyframes dash-flow { to { stroke-dashoffset: -40; } }
      @keyframes pulse-opacity { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

      .card-base { fill: #09090B; stroke: #27272A; stroke-width: 1.5; rx: 12; }
      .node-core { fill: #161B22; stroke: #10B981; stroke-width: 2; rx: 8; }
      .node-normal { fill: #18181B; stroke: #3F3F46; stroke-width: 1.5; rx: 8; }
      .flow-line { stroke: #3F3F46; stroke-width: 1.5; fill: none; stroke-dasharray: 4 6; animation: dash-flow 2s linear infinite; }
      
      .glow-bg { fill: #10B981; filter: blur(15px); opacity: 0.15; }
    </style>
    
    <!-- Pattern Grid Minimalis -->
    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" fill-opacity="0.03" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <!-- Unified Header Card -->
  <rect x="25" y="20" width="800" height="120" class="card-base" />
  <rect x="25" y="20" width="800" height="120" fill="url(#dot-grid)" rx="12" />
  
  <!-- Central Divider -->
  <line x1="380" y1="40" x2="380" y2="120" stroke="#27272A" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- ==================== LEFT: IDENTITY ==================== -->
  <text x="60" y="65" class="font-sans text-name">Arya Chaka Braja Wisesa</text>
  <text x="60" y="90" class="font-sans text-role">Backend Software Engineer</text>
  
  <!-- Status Indicator (Sekarang 100% presisi) -->
  <circle cx="65" cy="115" r="4" fill="#10B981" />
  <circle cx="65" cy="115" r="4" fill="#10B981" style="animation: pulse-opacity 2s infinite;" />
  <text x="80" y="119" class="font-sans text-stack" style="fill: #10B981; text-anchor: start;">Building Scalable Systems</text>

  <!-- ==================== RIGHT: SYSTEM VISUALIZATION ==================== -->
  <!-- Connection Lines -->
  <path d="M 500 80 L 560 80" class="flow-line" />
  <path d="M 660 80 L 720 80" class="flow-line" />

  <!-- Node 1: Client -->
  <rect x="420" y="55" width="80" height="50" class="node-normal" />
  <text x="460" y="75" class="font-sans text-node" style="fill: #A1A1AA;">CLIENT</text>
  <text x="460" y="93" class="font-sans text-stack">Next.js</text>

  <!-- Node 2: API Express (Core) - Kotak udah dilebarin! -->
  <rect x="550" y="45" width="110" height="70" class="glow-bg" rx="10" />
  <rect x="560" y="45" width="100" height="70" class="node-core" />
  <text x="610" y="73" class="font-sans text-node" style="fill: #10B981;">API CORE</text>
  <text x="610" y="95" class="font-sans text-stack" style="fill: #E4E4E7;">Express.js</text>

  <!-- Node 3: Database -->
  <rect x="720" y="55" width="80" height="50" class="node-normal" />
  <text x="760" y="75" class="font-sans text-node" style="fill: #A1A1AA;">DB_SYS</text>
  <text x="760" y="93" class="font-sans text-stack">PostgreSQL</text>

</svg>
