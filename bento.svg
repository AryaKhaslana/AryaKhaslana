<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .text-title { font-size: 16px; font-weight: 600; fill: #F4F4F5; letter-spacing: -0.2px; }
      .text-desc { font-size: 12px; font-weight: 400; fill: #A1A1AA; line-height: 1.5; }
      .text-tiny { font-size: 10px; font-weight: 500; fill: #71717A; letter-spacing: 0.5px; text-transform: uppercase; }
      .text-badge { font-size: 11px; font-weight: 500; fill: #D4D4D8; }
      
      /* Subtle Animations */
      @keyframes pulse-dot { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
      @keyframes pan-gradient { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
      @keyframes float-up { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

      .card-bg { fill: #121214; stroke: #27272A; stroke-width: 1; rx: 12; }
      .badge-bg { fill: #18181B; stroke: #27272A; stroke-width: 1; rx: 6; }
      .graph-line { fill: none; stroke: #3B82F6; stroke-width: 2; opacity: 0.7; stroke-linecap: round; }
    </style>

    <!-- Refined Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" stop-opacity="1" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="1" />
    </linearGradient>
    
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>

    <!-- Faint Dot Grid for Background Detail -->
    <pattern id="dot" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Main Background -->
  <rect width="100%" height="100%" fill="#09090B" />
  <rect width="100%" height="100%" fill="url(#dot)" />

  <!-- Title Section -->
  <text x="40" y="40" class="font-sans text-title" style="font-size: 20px;">Featured Engineering</text>
  <text x="40" y="60" class="font-sans text-desc">Selected works across full-stack development and system architecture.</text>

  <!-- ==================== BENTO CARD 1: ISCI-OrienaWeb (Left Large) ==================== -->
  <g transform="translate(40, 90)">
    <rect width="420" height="230" class="card-bg" fill="url(#card-grad)" />
    
    <text x="30" y="40" class="font-sans text-tiny">Frontend Architecture</text>
    <text x="30" y="65" class="font-sans text-title">ISCI-OrienaWeb</text>
    <text x="30" y="85" class="font-sans text-desc">Neo-brutalism e-commerce frontend</text>
    <text x="30" y="105" class="font-sans text-desc">engineered for an artisan bakery brand.</text>
    
    <!-- Status Indicator -->
    <g transform="translate(30, 195)">
      <circle cx="5" cy="5" r="4" fill="#10B981" />
      <circle cx="5" cy="5" r="4" fill="#10B981" style="animation: pulse-dot 3s infinite; transform-origin: 5px 5px;" />
      <text x="16" y="9" class="font-sans text-tiny" style="fill: #10B981;">PRODUCTION READY</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(30, 130)">
      <rect width="55" height="24" class="badge-bg" />
      <text x="27.5" y="16" text-anchor="middle" class="font-sans text-badge">React</text>
      
      <rect x="65" width="75" height="24" class="badge-bg" />
      <text x="102.5" y="16" text-anchor="middle" class="font-sans text-badge">Tailwind</text>
      
      <rect x="150" width="105" height="24" class="badge-bg" />
      <text x="202.5" y="16" text-anchor="middle" class="font-sans text-badge">Framer Motion</text>
    </g>

    <!-- Abstract Graph Decoration -->
    <g transform="translate(250, 130)" style="animation: float-up 6s ease-in-out infinite;">
      <path d="M 0 50 Q 40 10, 80 40 T 150 20" class="graph-line" />
      <path d="M 0 50 Q 40 10, 80 40 T 150 20 L 150 80 L 0 80 Z" fill="url(#blue-glow)" />
      <circle cx="150" cy="20" r="3" fill="#3B82F6" />
    </g>
  </g>

  <!-- ==================== BENTO CARD 2: Sole District (Top Right) ==================== -->
  <g transform="translate(480, 90)">
    <rect width="330" height="105" class="card-bg" fill="url(#card-grad)" />
    
    <text x="25" y="30" class="font-sans text-tiny">Monorepo System</text>
    <text x="25" y="52" class="font-sans text-title">sole-district</text>
    <text x="25" y="72" class="font-sans text-desc">Full-stack sneaker platform with</text>
    <text x="25" y="88" class="font-sans text-desc">secure auth &amp; dynamic catalog.</text>

    <!-- Mini Server Activity Blocks -->
    <g transform="translate(260, 25)">
      <rect x="0" y="0" width="8" height="25" rx="2" fill="#27272A" />
      <rect x="12" y="10" width="8" height="15" rx="2" fill="#3B82F6" />
      <rect x="24" y="5" width="8" height="20" rx="2" fill="#27272A" />
      <rect x="36" y="15" width="8" height="10" rx="2" fill="#3B82F6" style="animation: pulse-dot 2s infinite alternate;" />
    </g>
  </g>

  <!-- ==================== BENTO CARD 3: Google Hackathon (Bottom Right) ==================== -->
  <g transform="translate(480, 215)">
    <rect width="330" height="105" class="card-bg" fill="url(#card-grad)" />
    
    <text x="25" y="30" class="font-sans text-tiny">AI Integration</text>
    <text x="25" y="52" class="font-sans text-title">Google-Hackathon</text>
    <text x="25" y="72" class="font-sans text-desc">Web app themed "Convertlaravel"</text>
    <text x="25" y="88" class="font-sans text-desc">built for the Google Hackathon.</text>

    <!-- Minimalist Commits/Nodes -->
    <g transform="translate(250, 45)">
      <circle cx="0" cy="0" r="4" fill="#71717A" />
      <line x1="0" y1="0" x2="25" y2="25" stroke="#3F3F46" stroke-width="1.5" />
      <circle cx="25" cy="25" r="4" fill="#71717A" />
      <line x1="25" y1="25" x2="50" y2="10" stroke="#3F3F46" stroke-width="1.5" />
      <circle cx="50" cy="10" r="5" fill="#F4F4F5" style="filter: drop-shadow(0 0 4px rgba(255,255,255,0.5));" />
    </g>
  </g>
</svg>
